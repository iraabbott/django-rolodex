
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django5-rolodex"
version = "0.2.0"
description = "Contact and organization relationship graph for modern Django projects."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT License" }
authors = [
    { name = "Infinity Stack Team", email = "ops@softoboros.com" }
]
dependencies = [
    "Django>=4.2,<6.0",
    "djangorestframework>=3.15.0",
    "dj-database-url>=0.5.0",
    "networkx>=2.8",
    "django-taggit>=5.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4",
    "Framework :: Django :: 5",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/iraabbott/django-rolodex"
Source = "https://github.com/iraabbott/django-rolodex"
Issues = "https://github.com/iraabbott/django-rolodex/issues"

[tool.setuptools.packages.find]
exclude = ["example", "example.*"]

[tool.setuptools.package-data]
rolodex = [
    "templates/**/*.html",
    "static/**/*",
]
